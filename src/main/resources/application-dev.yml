spring:
  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:task_manager}"
    username: "${POSTGRES_USER:admin}"
    password: "${POSTGRES_PASSWORD:passw0rd}"
  jpa:
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

app:
  max-tasks-per-page: 15

logging:
  level:
    root: INFO
    com.andy.taskmanager: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
