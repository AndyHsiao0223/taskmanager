spring:
  application:
    name: taskmanager
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: false
    baseline-version: 20261119084647

management:
  endpoint:
    web:
      base-path: /actuator

  info:
    env:
      enabled: true

info:
  app:
    description: "Task management application"
    version: ${app.version}

app:
  name: "Task Manager System"
  version: "0.0.1"
