spring:
  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"
  jpa:
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

app:
  max-tasks-per-page: 50

logging:
  file:
    name: logs/taskmanager-prod.log

  level:
    root: WARN
    com.andy.taskmanager: INFO
